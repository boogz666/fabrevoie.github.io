name: Fragrance website checks
on:
  push:
    branches: [main, feat/ultra-macho-launch, feat/iris-editorial-2026, feat/official-waitlist-2026]
    paths: ['fragrance-site/**', '.github/workflows/fragrance-checks.yml']
  pull_request:
    paths: ['fragrance-site/**', '.github/workflows/fragrance-checks.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: fragrance-site
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fragrance-site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:popup
      - run: node tests/build-preview.mjs
